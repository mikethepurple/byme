name: Misha Erikov
bio: >-
  I'm a designer-founder in Paris. I've built startups and run ad and design
  studios, and these days I build my own things: Ada, a sketchbook that
  answers on the page; Detourist, one spot a day on a walk you already take;
  and Manga, my drawing practice. This is where I drop what I make, as it
  happens.
